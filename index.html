<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Garena · platform change OTP</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; padding: 68px 18px 24px;
    display: grid; place-items: start center;
    background: #eef1f5;
    color: #1f2328;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%; max-width: 430px; background: #fff;
    border-radius: 12px; padding: 26px 24px 22px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 30px rgba(16, 24, 40, .07);
  }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .avatar {
    width: 114px; height: 38px; border-radius: 9px; object-fit: contain;
    display: block; background: #f1f3f6;
  }
  .brand { font-size: 15px; font-weight: 800; letter-spacing: .2px; color: #1f2328; }
  .brand span { color: #c9242c; }

  h1 { font-size: 24px; line-height: 1.25; font-weight: 800; margin: 0 0 20px; letter-spacing: -.4px; }

  .field { position: relative; }
  .req {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #c9242c; font-size: 14px; font-weight: 700; pointer-events: none;
  }
  input[type="email"] {
    width: 100%; padding: 14px 14px 14px 27px;
    border: 1px solid #d6dbe2; border-radius: 8px; background: #fff;
    font-size: 15px; color: #1f2328; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #9aa3af; }
  input:focus { border-color: #c9242c; box-shadow: 0 0 0 3px rgba(201, 36, 44, .1); }

  .hint { margin: 10px 2px 20px; font-size: 13px; line-height: 1.5; color: #6b7280; }

  .captcha { margin: 0; }
  .voice-check { display: none; grid-template-columns: 1fr; gap: 9px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #eef0f3; }
  .voice-check.show { display: grid; }
  .sound-toggle { margin-top: 12px; }
  input#voice-code { min-width: 0; padding: 10px 12px; border: 1px solid #d6dbe2; border-radius: 8px; font-size: 14px; }
  .voice-button { padding: 10px 12px; font-size: 13px; }
  .modal.verify-modal { height: auto; max-width: 400px; }
  .verify-body { padding: 18px 18px 20px; background: #fff; }
  .verify-hint {
    margin: 0 0 14px; font-size: 13px; line-height: 1.45;
    color: #6b7280; text-align: center;
  }
  .captcha-box {
    position: relative; height: 52px; border-radius: 8px;
    background: #f4f6f8; border: 1px solid #d6dbe2;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .captcha-fill {
    position: absolute; top: 0; left: 0; bottom: 0; width: 0;
    background: rgba(201, 36, 44, .1);
  }
  .captcha-gap {
    position: absolute; top: 7px; bottom: 7px; width: 40px; margin-left: -20px;
    left: 0; display: none; border: 2px dashed rgba(201, 36, 44, .45);
    border-radius: 6px; pointer-events: none;
  }
  .captcha-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 13px; color: #6b7280; pointer-events: none;
  }
  .captcha-handle {
    position: absolute; top: 4px; left: 4px; width: 44px; height: 44px;
    display: grid; place-items: center; border-radius: 6px;
    background: #fff; border: 1px solid #cfd5dd; color: #c9242c;
    cursor: grab; outline: none;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .12);
    transition: background .18s, border-color .18s, color .18s;
  }
  .captcha-handle:focus-visible { box-shadow: 0 0 0 3px rgba(201, 36, 44, .18); }
  .captcha.dragging .captcha-handle { cursor: grabbing; }
  .captcha.ok .captcha-handle { background: #12b76a; border-color: #12b76a; color: #fff; cursor: default; }
  .captcha.ok .captcha-fill { background: rgba(18, 183, 106, .16); }
  .captcha.ok .captcha-label { color: #067647; font-weight: 600; }
  .captcha.bad .captcha-handle { border-color: #f04438; color: #f04438; }
  .captcha.bad .captcha-label { color: #b42318; }

  button {
    width: 100%; padding: 14px 16px; border: 0; border-radius: 8px;
    background: #c9242c; color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background .15s, transform .08s;
  }
  button:hover:not(:disabled) { background: #ac1d24; }
  button:active:not(:disabled) { transform: scale(.995); }
  button:disabled { background: #c9ced6; cursor: not-allowed; }
  button.counting,
  button.counting:disabled { background: #12b76a; cursor: default; }

  #unsub { margin-top: 10px; background: #c9242c; }
  #unsub:hover:not(:disabled) { background: #ac1d24; }
  .unsub-note {
    margin: 9px 2px 0; font-size: 12px; line-height: 1.45;
    color: #9aa3af; text-align: center;
  }

  #out {
    display: none; margin-top: 16px; padding: 11px 12px; border-radius: 8px;
    font-size: 13.5px; line-height: 1.5; word-break: break-word;
  }
  #out.ok { display: block; background: #ecfdf3; border: 1px solid #abefc6; color: #067647; }
  #out.err { display: block; background: #fef3f2; border: 1px solid #fecdca; color: #b42318; }

  .legal {
    margin: 20px 0 0; font-size: 13px; line-height: 1.55; color: #6b7280; text-align: center;
  }
  .legal a,
  .legal .link {
    display: inline; width: auto; color: #2563eb; text-decoration: none;
    background: none; border: 0; border-radius: 0; padding: 0;
    font: inherit; font-weight: 400; cursor: pointer;
  }
  .legal a:hover,
  .legal .link:hover { text-decoration: underline; }

  .overlay {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 18px;
    background: rgba(17, 24, 39, .55);
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%; max-width: 660px; height: min(80vh, 760px);
    background: #fff; border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(16, 24, 40, .28);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 13px 16px; border-bottom: 1px solid #eef0f3;
  }
  .modal-head h3 { margin: 0; font-size: 16px; font-weight: 700; color: #1f2328; }
  .modal-head .close {
    width: 32px; height: 32px; flex: 0 0 auto; border: 0; border-radius: 8px;
    background: #f3f4f6; color: #374151; font-size: 19px; line-height: 1;
    cursor: pointer; padding: 0;
  }
  .modal-head .close:hover { background: #e5e7eb; }
  .modal-body { flex: 1 1 auto; background: #f7f8fa; min-height: 0; }
  .modal-body iframe { display: block; width: 100%; height: 100%; border: 0; }
  .modal-foot {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-top: 1px solid #eef0f3;
    font-size: 12.5px; color: #6b7280;
  }
  .modal-foot a { color: #2563eb; text-decoration: none; white-space: nowrap; }
  .modal-foot a:hover { text-decoration: underline; }

  .disclaimer {
    margin: 14px 0 0; padding-top: 14px; border-top: 1px solid #eef0f3;
    font-size: 11.5px; line-height: 1.5; color: #9aa3af; text-align: center;
  }

  .tutorial-btn {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    display: inline-flex; align-items: center; gap: 9px;
    width: auto; padding: 10px 16px 10px 12px;
    border-radius: 6px; background: #d9232e; color: #fff;
    font: 700 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: .2px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(201, 36, 44, .35);
  }
  .tutorial-btn:hover:not(:disabled) { background: #b81c26; }
  .tutorial-btn svg { display: block; width: 27px; height: 19px; flex: 0 0 auto; }

  .tutorial-overlay { z-index: 120; }
  .tutorial-modal { max-width: 660px; height: auto; }
  .tutorial-body { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .tutorial-body iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .tutorial-open {
    position: absolute; right: 10px; bottom: 10px; z-index: 2;
    padding: 8px 12px; border-radius: 6px;
    background: #d9232e; color: #fff; font: 600 12px/1 Arial, sans-serif;
    text-decoration: none;
  }
  .tutorial-open:hover { background: #b81c26; }

  @media (max-width: 420px) {
    .card { padding: 22px 18px 18px; }
    h1 { font-size: 22px; }
    .tutorial-btn { top: 10px; right: 10px; padding: 8px 12px 8px 10px; font-size: 13px; gap: 7px; }
    .tutorial-btn svg { width: 23px; height: 16px; }
  }
</style>
</head>

ield (not sent anywhere)\" aria-label=\"Demo field\"><button class=\"demo-send\" id=\"openVerify\">Send demo request<\/button><p class=\"demo-note\">No email, OTP, API, or account action is performed.<\/p><\/section><\/main>\n  <div class=\"modal\" id=\"verifyModal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Verification required\"><div class=\"dialog\" style=\"width:min(390px,100%)\"><div class=\"dialog-head\">Verification required <button class=\"close\" id=\"closeVerify\" aria-label=\"Close\">\u00d7<\/button><\/div><section class=\"box\" aria-label=\"Standalone verification demo\">\n      <div class=\"tabs\"><button class=\"tab active\" id=\"imageTab\" aria-label=\"Slider check\">\u2301<\/button><button class=\"tab\" id=\"soundTab\" aria-label=\"Sound check\">\ud83d\udd0a<\/button><button class=\"refresh\" id=\"refresh\" aria-label=\"New demonstration\">\u27f3<\/button><\/div>\n      <div class=\"panel active\" id=\"imagePanel\"><p class=\"hint\">Slide right to secure your access<\/p><div class=\"slider\" id=\"slider\"><div class=\"handle\" id=\"handle\">\u2192<\/div><div class=\"end\">\u2192<\/div><\/div><\/div>\n      <div class=\"panel\" id=\"soundPanel\"><p><strong>Please type the numbers you hear.<\/strong><\/p><button class=\"audio-play\" id=\"playSound\" aria-label=\"Play demo number\">\u25b6<\/button><div class=\"digits\"> <input class=\"digit\" maxlength=\"1\"><input class=\"digit\" maxlength=\"1\"><input class=\"digit\" maxlength=\"1\"><input class=\"digit\" maxlength=\"1\"><input class=\"digit\" maxlength=\"1\"><input class=\"digit\" maxlength=\"1\"><\/div><button class=\"verify\" id=\"verify\">Verify<\/button><\/div>\n      <div class=\"status\" id=\"status\" aria-live=\"polite\"><\/div>\n    <\/section><\/div><\/div>\n  <div class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Tutorial\"><div class=\"dialog\"><div class=\"dialog-head\">Tutorial <button class=\"close\" id=\"closeTutorial\" aria-label=\"Close\">\u00d7<\/button><\/div><iframe class=\"video\" src=\"https://www.youtube-nocookie.com/embed/GgyeAYUUuRo\" title=\"Tutorial video\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen><\/iframe><\/div><\/div>\n<script>\n(() => {\n const $=id=>document.getElementById(id), status=$('status'), handle=$('handle'), slider=$('slider');\n let dragging=false,start=0,left=0;\n const showPanel=mode=>{ $('imageTab').classList.toggle('active',mode==='image');$('soundTab').classList.toggle('active',mode==='sound');$('imagePanel').classList.toggle('active',mode==='image');$('soundPanel').classList.toggle('active',mode==='sound');status.textContent=''; };\n $('imageTab').onclick=()=>showPanel('image'); $('soundTab').onclick=()=>showPanel('sound');\n $('refresh').onclick=()=>{handle.style.left='-1px';status.textContent='';document.querySelectorAll('.digit').forEach(x=>x.value='');};\n handle.addEventListener('pointerdown',e=>{dragging=true;start=e.clientX;left=parseFloat(handle.style.left||'-1');handle.setPointerCapture(e.pointerId)});\n handle.addEventListener('pointermove',e=>{if(!dragging)return;const max=slider.clientWidth-handle.offsetWidth;const x=Math.max(0,Math.min(max,left+e.clientX-start));handle.style.left=x+'px'});\n handle.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;const max=slider.clientWidth-handle.offsetWidth;if(parseFloat(handle.style.left||'0')>max*.82){status.textContent='Verified';window.parent.postMessage({type:'verification-success'},'*');}else{handle.style.left='-1px';status.textContent='Try again';}});\n $('playSound').onclick=()=>{if(!speechSynthesis)return;const n=String(Math.floor(100000+Math.random()*900000));$('playSound').dataset.number=n;document.querySelectorAll('.digit').forEach(x=>x.value='');speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(n.split('').join(' ')));};\n document.querySelectorAll('.digit').forEach((x,i,a)=>x.addEventListener('inp function close(){verification.style.display='none';verification.srcdoc='';document.body.style.overflow='';document.getElementById('send').focus();}
let pendingType='platform';
const DAY=24*60*60*1000;
const labels={platform:'Platform change OTP',unsubscribe:'Single unsubscribe OTP'};
function keyFor(type,mail){return 'otp-sent:'+type+':'+normalizeMail(mail);}
function normalizeMail(mail){
var m=String(mail||'').trim().toLowerCase(),at=m.lastIndexOf('@');
if(at<0)return m;
var local=m.slice(0,at),domain=m.slice(at+1);
if(domain==='gmail.com'||domain==='googlemail.com'){local=local.split('+')[0].replace(/\./g,'');domain='gmail.com';}
return local+'@'+domain;
}
const ALREADY_SENT='OTP was already sent to this email in the last 24 hours. Try again later.';
function sentRecently(type,mail){try{const t=parseInt(localStorage.getItem(keyFor(type,mail))||'0',10);return t&&Date.now()-t<DAY;}catch(e){return false;}}
function show(msg,cls){out.textContent=msg;out.className=cls;out.style.display='block';}
function open(type){
if(!email.value.trim()){show('Enter your email address first.','err');email.focus();return;}
if(sentRecently(type,email.value)){show(ALREADY_SENT,'err');return;}
pendingType=type;
out.style.display='none';verification.srcdoc=verificationSource;verification.style.display='block';document.body.style.overflow='hidden';
}
function api(path){return (window.origin&&window.origin!=='null'?window.origin:'')+path;}
async function captchaGrant(){
try{
const c=await fetch(api('/captcha/challenge')).then(function(r){return r.json();});
if(!c||!c.ok||!c.required)return '';
const v=await fetch(api('/captcha/verify'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge:c.challenge,x:c.target})}).then(function(r){return r.json();});
return v&&v.ok?(v.token||''):'';
}catch(e){return '';}
}
async function sendOtp(type){
const mail=email.value.trim();
try{
const token=await captchaGrant();
const res=await fetch(api('/api/public/send-otp'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:mail,type:type,captcha:token})});
const data=await res.json();
if(data&&data.ok){
try{localStorage.setItem(keyFor(type,mail),String(Date.now()));}catch(e){}
out.style.display='none';
return;
}
var msg=(data&&data.error)||'Request failed. Try again.';
show(msg,'err');
}catch(e){show('Network error. Check your connection and try again.','err');}
}
const btns={platform:document.getElementById('send'),unsubscribe:document.getElementById('unsub')};
function countdown(type){
const btn=btns[type],started=Date.now(),orig=btn.textContent;
Object.keys(btns).forEach(function(k){btns[k].disabled=true;});
btn.style.background='#9aa0a6';btn.style.color='#fff';btn.style.cursor='not-allowed';
btn.textContent='Please wait...';
Promise.resolve(sendOtp(type)).then(function(){
setTimeout(function(){
btn.textContent=orig;btn.style.background='';btn.style.color='';btn.style.cursor='';
Object.keys(btns).forEach(function(k){btns[k].disabled=false;});
},Math.max(0,2000-(Date.now()-started)));
});
}
document.getElementById('send').addEventListener('click',function(){open('platform');});
document.getElementById('unsub').addEventListener('click',function(){open('unsubscribe');});
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();open('platform');});
window.addEventListener('message',function(e){if(e.source===verification.contentWindow&&e.data&&e.data.type==='verification-close')close();if(e.source===verification.contentWindow&&e.data&&e.data.type==='verification-success'){const t=pendingType;close();countdown(t);}});
const policy=document.getElementById('policy-overlay'),frame=document.getElementById('policy-frame');
const policies={tos:['Terms of service','https://content.garena.com/legal/tos/india_tos_en.html'],privacy:['Privacy policy','https://content.garena.com/legal/pp/pp_en.html']};
function closePolicy(){policy.classList.remove('show');policy.setAttribute('aria-hidden','true');frame.src='about:blank';document.body.style.overflow='';}
document.querySelectorAll('[data-policy]').forEach(function(button){button.addEventListener('click',function(){const p=policies[button.dataset.policy];document.getElementById('policy-title').textContent=p[0];frame.src=p[1];policy.classList.add('show');policy.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';});});
document.getElementById('policy-close').addEventListener('click',closePolicy);
policy.addEventListener('click',function(e){if(e.target===policy)closePolicy();});
const tutorial=document.getElementById('tutorial-overlay'),tutorialFrame=document.getElementById('tutorial-frame');
const TUTORIAL_SRC='https://www.youtube-nocookie.com/embed/GgyeAYUUuRo?autoplay=1&rel=0&modestbranding=1&playsinline=1';
function openTutorial(){tutorialFrame.src=TUTORIAL_SRC;tutorial.classList.add('show');tutorial.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
function closeTutorial(){tutorial.classList.remove('show');tutorial.setAttribute('aria-hidden','true');tutorialFrame.src='about:blank';if(!policy.classList.contains('show'))document.body.style.overflow='';}
